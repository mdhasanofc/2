name: Deploy LiveLens to InfinityFree

on:
  push:
    branches: [main]
    paths:
      - 'live-cam-landing/**'
      - '.github/workflows/infinityfree-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy LiveLens to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: if0_42933847
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./live-cam-landing/
          server-dir: /htdocs/
          dangerous-clean-slate: false
